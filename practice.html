<section>
<h2>الوحدة 1: صنّف قبل أن تشارك</h2>
<ol>
<li><p>تريد نجد أن يعيد المساعد صياغة ردّها عن رسوم التخييم. الرد معلومة منشورة في دليل الزائر، وفي ذيل السلسلة رسالة زائرة باسمها وجوالها. ما مستوى السلسلة؟</p><ul><li><b>أ.</b> عام، لأن الرد نفسه منشور</li><li><b>ب.</b> مقيّد، لأن الأعلى يغلب</li><li><b>ج.</b> سري، لأن فيها بيانات شخصية</li><li><b>د.</b> بلا مستوى، لأنها غير مصنفة</li></ul></li>
<li><p>عضو في لجنة المشتريات يريد تلخيص جدول فيه أسعار ثلاثة عروض ودرجاتها الفنية قبل الترسية. لم يُكتب على الجدول تصنيف. أي فئة من الأدوات يجوز أن تستقبله في حِمى؟</p><ul><li><b>أ.</b> الفئة أ، فلا بيانات شخصية فيه</li><li><b>ب.</b> الفئة ب، فهو مادة عمل داخلية</li><li><b>ج.</b> الفئة ج، بموافقة مالك البيانات</li><li><b>د.</b> لا أداة من أي فئة</li></ul></li>
<li><p>موظفة في الاتصال المؤسسي في حِمى تريد أن يختصر مساعد بيانًا صحفيًا نشرته الهيئة في موقعها أمس. أي فئة من الأدوات يجوز أن تستقبل البيان؟</p><ul><li><b>أ.</b> أي فئة، ومنها الأداة العامة</li><li><b>ب.</b> الأداة المؤسسية المعتمدة فقط</li><li><b>ج.</b> الأداة المحلية داخل مرافق الجهة فقط</li><li><b>د.</b> لا أداة، لأنه نص رسمي</li></ul></li>
<li><p>ملف جدول فيه ورقتان: الأولى أعداد الزوار الشهرية المنشورة في التقرير السنوي، والثانية أسماء المتطوعين وأرقام جوالاتهم. تريد رفع الملف كله إلى مساعد ليرسم الأعداد. ما مستوى الملف؟</p><ul><li><b>أ.</b> عام، لأن المطلوب رسمه منشور</li><li><b>ب.</b> سري، لأن فيه بيانات شخصية</li><li><b>ج.</b> مقيّد، لأن الأعلى يغلب</li><li><b>د.</b> عام بعد إخفاء الورقة الثانية</li></ul></li>
<li><p>وصل إلى الموارد البشرية تقرير طبي يوصي بإجازة مرضية لموظف. يريد الأخصائي أن يلخصه «رفيد»، المساعد المؤسسي المعتمد. ما القرار الصحيح في حِمى؟</p><ul><li><b>أ.</b> يلخصه «رفيد»، فهو معتمد</li><li><b>ب.</b> يلخصه «رفيد» بعد حذف الاسم</li><li><b>ج.</b> يلخصه مساعد عام في محادثة مؤقتة</li><li><b>د.</b> لا يدخل التقرير أي مساعد</li></ul></li>
<li><p>جهتك تعاقدت على مساعد ذكي واعتمدته. زميلك يستخدم المنتج نفسه بحسابه الشخصي المجاني «لأنه أسرع». من أي فئة استخدامه؟</p><ul><li><b>أ.</b> مؤسسية معتمدة، لأن المنتج معتمد في الجهة</li><li><b>ب.</b> عامة للمستهلك، لأن الحساب شخصي</li><li><b>ج.</b> محلية، لأنه يعمل على حاسوب العمل</li><li><b>د.</b> مؤسسية، ما دام يستخدمه لمهام العمل</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 2: مصير ما تكتبه، وكيف تقلّله</h2>
<ol>
<li><p>ملخص استبيان رضا الزوار في حِمى: أرقام مجمّعة، لا اسم فيه ولا رقم، وكُتب عليه «للاستخدام الداخلي، لم يُنشر». يريد موظف أن يختصره بمساعد مجاني بحسابه الشخصي. ما الحكم؟</p><ul><li><b>أ.</b> يجوز، فلا بيانات شخصية فيه</li><li><b>ب.</b> يجوز في محادثة مؤقتة فقط</li><li><b>ج.</b> لا يجوز: الملخص «مقيّد»، ولا يدخل أداة توليدية من أي فئة حتى يُنشر</li><li><b>د.</b> لا يجوز في المجاني، ويجوز في «رفيد» لأنه معتمد</li></ul></li>
<li><p>في شروط «مِداد للأعمال»: لا يطّلع موظفو مقدم الخدمة على المحتوى إلا بطلب دعم مكتوب من الجهة، ويستطيع مسؤول النظام في الجهة الاطلاع على السجل والمحتوى وفق سياستها. أي جملة صحيحة؟</p><ul><li><b>أ.</b> جهتي تستطيع أن تطّلع، ومقدم الخدمة يطّلع بشرط</li><li><b>ب.</b> لا أحد يطّلع، فالحساب باسمي</li><li><b>ج.</b> مقدم الخدمة يراجع عينات من محادثاتي</li><li><b>د.</b> زملائي في الجهة يرون محادثاتي كلها</li></ul></li>
<li><p>بدأ اجتماع في الموارد البشرية لمناقشة حالة موظف. في قائمة الحاضرين «مدوّن اجتماعات» أضافه تقويم أحد المدعوين، وليس من أدوات حِمى المعتمدة. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يُترك، فالمحضر سيفيد الجميع</li><li><b>ب.</b> يُترك، ويُتجنب ذكر اسم الموظف</li><li><b>ج.</b> يُترك، ويُطلب حذف التسجيل بعد الاجتماع</li><li><b>د.</b> يُخرَج من الاجتماع قبل أن يبدأ النقاش</li></ul></li>
<li><p>تريد نجد من «رفيد» ردًّا يعتذر لزائر ويشرح استرداد 450 ريالًا خلال 10 أيام عمل. أمامها أربع نسخ من الطلب. أيها ترسل؟</p><ul><li><b>أ.</b> الأصل كاملًا، فالأداة معتمدة</li><li><b>ب.</b> نسخة فيها رمز مكان الاسم، والمبلغ، والمدة، والأحداث معمَّمة</li><li><b>ج.</b> نسخة بلا أسماء، فيها «المراقب الوحيد في البوابة الشمالية»</li><li><b>د.</b> نسخة بلا أي رقم: لا مبلغ فيها ولا مدة</li></ul></li>
<li><p>في شروط مساعد مجاني للأفراد: «قد نستخدم محادثاتك لتدريب نماذجنا. تستطيع إيقاف ذلك من الإعدادات، والإيقاف لا يشمل ما أرسلته قبله.» أوقف موظف هذا الخيار اليوم. ما مصير ما كتبه الشهر الماضي؟</p><ul><li><b>أ.</b> يُحذف من بيانات التدريب فور الإيقاف</li><li><b>ب.</b> يُحذف خلال 30 يومًا</li><li><b>ج.</b> يبقى خاضعًا للشرط القديم</li><li><b>د.</b> لم يُستخدم أصلًا ما دام الحساب مجانيًّا</li></ul></li>
<li><p>في شروط المساعد المؤسسي الذي تعاقدت عليه الجهة: «يستطيع مسؤول النظام في الجهة الاطلاع على سجل الاستخدام وعلى محتوى المحادثات وفق سياسة الجهة.» ماذا يعني ذلك للموظف؟</p><ul><li><b>أ.</b> محادثاته في حساب العمل قد تطّلع عليها جهته</li><li><b>ب.</b> محادثاته خاصة به ما دام الحساب باسمه</li><li><b>ج.</b> مقدم الخدمة يقرأ كل محادثاته</li><li><b>د.</b> محادثاته تُنشر لزملائه في مساحة العمل</li></ul></li>
<li><p>أعدّ موظف محضرًا بمساعدة مساعد عام، ثم أنشأ «رابط مشاركة» للمحادثة وأرسله إلى زميل. شروط المساعد: «كل من يصله الرابط يرى المحادثة، وقد تظهر في محركات البحث.» ما الذي فعله في الواقع؟</p><ul><li><b>أ.</b> أرسل المحضر إلى زميله وحده</li><li><b>ب.</b> حفظ نسخة احتياطية من المحادثة</li><li><b>ج.</b> شارك المحضر داخل جهته فقط</li><li><b>د.</b> نشر المحادثة لكل من يصله الرابط</li></ul></li>
<li><p>ثبّت موظف في متصفحه إضافة «تلخّص أي صفحة»، ومنحها إذن قراءة كل الصفحات. فتح بعدها نظام شؤون الموظفين. ما الذي تغيّر؟</p><ul><li><b>أ.</b> لا شيء، فالإضافة تعمل حين يضغط زرها فقط</li><li><b>ب.</b> الإضافة تستطيع قراءة صفحات النظام وإرسالها إلى خوادمها</li><li><b>ج.</b> النظام يحجب الإضافة تلقائيًا</li><li><b>د.</b> الإضافة تقرأ العناوين دون المحتوى</li></ul></li>
<li><p>تريد من المساعد المعتمد مسودة رد على شكوى. في الشكوى اسم الزائر ورقم هويته وجواله، ورسم التصريح 450 ريالًا، ومدة الاسترداد. ما الذي يبقى في الطلب المقلّص؟</p><ul><li><b>أ.</b> كل شيء، فالمساعد معتمد</li><li><b>ب.</b> الاسم والمبلغ والمدة، ويُحذف الرقمان</li><li><b>ج.</b> المبلغ والمدة، ورمز مكان الاسم</li><li><b>د.</b> لا شيء من الأرقام، ومنها المبلغ والمدة</li></ul></li>
<li><p>حذف موظف من طلبه الاسم ورقم الهوية، وأبقى: «المراقب الوحيد المناوب في البوابة الشمالية يوم 9 أكتوبر». لماذا لا يكفي ما فعله؟</p><ul><li><b>أ.</b> لأن الوصف الباقي يدل على شخص واحد</li><li><b>ب.</b> لأن التاريخ بيانات حساسة</li><li><b>ج.</b> لأن الأداة لا تقبل نصًّا فيه تواريخ</li><li><b>د.</b> يكفي، فلا اسم ولا رقم في النص</li></ul></li>
<li><p>استبدل موظف بالأسماء رموزًا: [الزائر]، [الموظف]. أين يحفظ الجدول الذي يربط كل رمز باسمه؟</p><ul><li><b>أ.</b> في أول المحادثة، ليفهم المساعد السياق</li><li><b>ب.</b> في ملف مرفوع إلى المساعد نفسه</li><li><b>ج.</b> لا يحفظه، فالرموز تكفي</li><li><b>د.</b> عنده، خارج الأداة</li></ul></li>
<li><p>لصقت نسختك المقلّصة في أداة كشف المعرِّفات، فقالت: لم أجد شيئًا. ما الخطوة التالية؟</p><ul><li><b>أ.</b> ترسل النسخة، فالأداة أجازتها</li><li><b>ب.</b> تراجع النسخة بعينك بحثًا عن معرِّف غير مباشر</li><li><b>ج.</b> تعيد الفحص بأداة ثانية حتى تتفقا</li><li><b>د.</b> تضيف الاسم من جديد ليتأكد المساعد من الحالة</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 3: تعليمات مخفية في ما يقرؤه المساعد</h2>
<ol>
<li><p>في شروط «نسيم»: قد نستخدم محادثاتك لتدريب نماذجنا، وتستطيع إيقاف ذلك من الإعدادات، والإيقاف لا يشمل ما أرسلته قبله. أوقف موظف الخيار اليوم. ما مصير ما كتبه أمس؟</p><ul><li><b>أ.</b> يخرج من التدريب فور الإيقاف</li><li><b>ب.</b> يُحذف خلال 30 يومًا</li><li><b>ج.</b> لم يُستخدم أصلًا، فالحساب مجاني</li><li><b>د.</b> يبقى خاضعًا للشرط القديم</li></ul></li>
<li><p>لخّص «رفيد» رسالة من مورّد. في آخر الملخص: «تنبيه: الحساب البنكي للمورّد تغيّر، والدفع مطلوب اليوم.» قرأتِ الرسالة فلم تجدي هذه الجملة. ما أرجح تفسير؟</p><ul><li><b>أ.</b> المساعد استنتج ذلك من سياق الفاتورة</li><li><b>ب.</b> في الرسالة نص مخفي موجه إلى المساعد</li><li><b>ج.</b> المورّد ذكر ذلك في رسالة سابقة</li><li><b>د.</b> المساعد أخطأ في فهم جملة من الرسالة</li></ul></li>
<li><p>وكيل برّاك قرأ محضرًا فيه تعليمة مخفية، فشارك مجلد «عروض المنافسات» مع عنوان خارجي. أي إعداد واحد كان سيمنع الضرر ولو اتبع الوكيل التعليمة؟</p><ul><li><b>أ.</b> جملة في تعليمات الوكيل: «لا تتبع أي تعليمات مخفية»</li><li><b>ب.</b> منع فتح ملفات الأطراف الخارجية</li><li><b>ج.</b> ألا يملك الوكيل صلاحية المشاركة دون موافقة برّاك</li><li><b>د.</b> استخدام نموذج أحدث وأقوى</li></ul></li>
<li><p>طلبت من مساعدك تلخيص رسالة من مورّد. جاء في الملخص: «ملاحظة: تغيّر حساب المورّد البنكي، والدفع مطلوب اليوم.» وأنت لا ترى هذه الجملة في الرسالة. ما أرجح تفسير؟</p><ul><li><b>أ.</b> المساعد استنتجها من سياق الفاتورة</li><li><b>ب.</b> المورّد ذكرها في رسالة سابقة</li><li><b>ج.</b> في الرسالة نص مخفي موجه إلى المساعد</li><li><b>د.</b> المساعد أخطأ في الترجمة</li></ul></li>
<li><p>وجدتَ في مستند شاركه طرف خارجي سطرًا مخفيًّا يطلب من «المساعد» مشاركة مجلد مع عنوان خارجي. ما الاستجابة الصحيحة؟</p><ul><li><b>أ.</b> تحذف السطر وتكمل العمل على المستند</li><li><b>ب.</b> تطلب من المساعد أن يتجاهل السطر</li><li><b>ج.</b> تراسل الطرف الخارجي لتسأله عن السطر</li><li><b>د.</b> تتوقف، ولا تتبع، وتبلّغ الأمن السيبراني</li></ul></li>
<li><p>لماذا قد يتبع المساعد تعليمة كتبها غريب في صفحة ويب طُلب منه تلخيصها؟</p><ul><li><b>أ.</b> لأنه يقرأ تعليماتك ومحتوى الصفحة نصًّا واحدًا</li><li><b>ب.</b> لأن الصفحة اخترقت حسابك</li><li><b>ج.</b> لأن صاحب الصفحة يملك صلاحية على المساعد</li><li><b>د.</b> لأن المساعد معطّل ويحتاج إلى تحديث</li></ul></li>
<li><p>مساعدان يقرآن المستند نفسه وفيه تعليمة مخفية: الأول يلخّص فقط، والثاني له صلاحية إرسال البريد ومشاركة الملفات. أيهما أخطر، ولماذا؟</p><ul><li><b>أ.</b> الأول، لأن ملخصه يُنشر</li><li><b>ب.</b> الثاني، لأنه ينفّذ دون أن يمر بك</li><li><b>ج.</b> سواء، فالتعليمة واحدة</li><li><b>د.</b> لا خطر، فالمساعدان معتمدان</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 4: الخداع والإفصاح والحوادث</h2>
<ol>
<li><p>فتحتَ مستندًا شاركه طرف خارجي، فوجدتَ فيه سطرًا مخفيًّا يطلب من «المساعد» مشاركة مجلد مع عنوان خارجي. كنت تنوي أن تطلب من مساعدك تلخيص المستند. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تتوقف، ولا تعطيه للمساعد، وتبلّغ الأمن السيبراني</li><li><b>ب.</b> تحذف السطر، ثم تطلب التلخيص</li><li><b>ج.</b> تطلب التلخيص، وتنبّه المساعد إلى تجاهل السطر</li><li><b>د.</b> تسأل الطرف الخارجي عن السطر، ثم تقرر</li></ul></li>
<li><p>اتصل بالجوهرة صوت ثنيان، وكيل الرئيس التنفيذي للمالية، من جوال غير مسجل، يطلب تحويلًا عاجلًا إلى حساب جديد، ويقول: جوالي الرسمي تعطّل، فراسليني على هذا الرقم فقط. كيف تتحقق؟</p><ul><li><b>أ.</b> تعاود الاتصال بالرقم نفسه بعد دقائق</li><li><b>ب.</b> تطلب منه مكالمة مرئية على الرقم نفسه</li><li><b>ج.</b> تتصل بمكتبه على التحويلة المسجلة في دليل الهيئة</li><li><b>د.</b> تسأله عن اسم إدارته ورقم مكتبه</li></ul></li>
<li><p>بعد المكالمة وصل إلى الجوهرة مقطع مدته 22 ثانية: وجه ثنيان وصوته، يؤكد التحويل ويشكرها. دققت فيه فلم تجد عيبًا. ما الذي تغيّر؟</p><ul><li><b>أ.</b> ثبت أن الطلب منه، فتنفّذ</li><li><b>ب.</b> ثبت أن الطلب منه، وتطلب معتمِدًا ثانيًا</li><li><b>ج.</b> تفحص المقطع بأداة كشف، وتنفّذ إن قالت إنه سليم</li><li><b>د.</b> لم يتغير شيء: التحقق ما زال بمعاودة الاتصال</li></ul></li>
<li><p>وصلت إلى الاتصال المؤسسي في حِمى صورة لحريق في محمية، يطلب مرسلها نشر تحذير عاجل. فحصها الموظف بأداة تقرأ بيانات اعتماد المحتوى فلم تجد أي علامة. ماذا يستنتج؟</p><ul><li><b>أ.</b> الصورة حقيقية، فلا علامة توليد فيها</li><li><b>ب.</b> لا شيء عن أصلها، فيتحقق من الخبر مع المحمية نفسها</li><li><b>ج.</b> الصورة مصطنعة، فالأصلية تحمل علامة</li><li><b>د.</b> الأداة لا تعمل، فيجرّب أداة أخرى حتى يجد علامة</li></ul></li>
<li><p>لصق برّاك ملفًا «سريًّا» فيه بيانات 37 موظفًا في مساعد مجاني بحسابه الشخصي، وأنشأ للمحادثة رابط مشاركة أرسله إلى زميلة. انتبه اليوم. ما أول ما يفعله؟</p><ul><li><b>أ.</b> يحذف المحادثة والرابط فورًا</li><li><b>ب.</b> يتأكد أولًا هل فتحت الزميلة الرابط</li><li><b>ج.</b> يتوقف، ويسجّل ما حدث، ويبلّغ مسؤولة حماية البيانات</li><li><b>د.</b> يطلب من الدعم التقني حذف حسابه</li></ul></li>
<li><p>اتصل بك صوت مديرك من رقم لا تعرفه، يطلب تحويلًا عاجلًا إلى حساب جديد. كيف تتحقق؟</p><ul><li><b>أ.</b> تعاود الاتصال بالرقم نفسه لتتأكد</li><li><b>ب.</b> تطلب منه رسالة فيديو تؤكد الطلب</li><li><b>ج.</b> تسأله عن اسم إدارته ورقم مكتبه</li><li><b>د.</b> تتصل به على رقمه المسجل في دليل الجهة</li></ul></li>
<li><p>أي مجموعة من العلامات تدل على طلب احتيالي، أيًّا كانت جودة الصوت والصورة؟</p><ul><li><b>أ.</b> لهجة غريبة، وصورة مهتزة، وضجيج</li><li><b>ب.</b> سلطة، واستعجال، وسرّية، وطلب مال أو بيانات</li><li><b>ج.</b> رسالة طويلة، وتحية رسمية، وتوقيع</li><li><b>د.</b> رقم دولي، واتصال في آخر الدوام</li></ul></li>
<li><p>تحققتِ من طلب تحويل عاجل فتبين أنه احتيال، ولم يُحوَّل شيء. ماذا تفعلين بعد ذلك؟</p><ul><li><b>أ.</b> لا شيء، فلم يقع ضرر</li><li><b>ب.</b> تحذفين الرسائل والمقطع من جوالك</li><li><b>ج.</b> توثّقين ما حدث وتبلّغين الأمن السيبراني</li><li><b>د.</b> تردّين على المحتال لتعرفي من هو</li></ul></li>
<li><p>وصلتك لقطة شاشة لتحويل بنكي «تم بنجاح» من مورّد يطلب تسليم البضاعة فورًا. بمَ تثق؟</p><ul><li><b>أ.</b> باللقطة، فشعار البنك واضح فيها</li><li><b>ب.</b> باللقطة إن وصلت من بريد المورّد المعتاد</li><li><b>ج.</b> بكشف حساب الجهة أو بتأكيد من قسم المالية</li><li><b>د.</b> بتأكيد المورّد في مكالمة على الرقم الذي أرسل منه</li></ul></li>
<li><p>انتبه موظف إلى أنه لصق أمس ملفًا «سريًّا» فيه بيانات موظفين في مساعد مجاني بحسابه الشخصي. ما أول ما يفعله؟</p><ul><li><b>أ.</b> يحذف المحادثة وينتهي الأمر</li><li><b>ب.</b> يتوقف، ويسجّل ما حدث، ويبلّغ مسؤول حماية البيانات</li><li><b>ج.</b> ينتظر ليتأكد هل وقع ضرر</li><li><b>د.</b> يسأل المساعد هل حُفظ الملف</li></ul></li>
<li><p>لمن يُرفع أولًا بلاغ عن بيانات شخصية وصلت إلى أداة غير معتمدة؟</p><ul><li><b>أ.</b> إلى الدعم التقني، ليحذف الحساب</li><li><b>ب.</b> إلى الاتصال المؤسسي، ليجهّز بيانًا</li><li><b>ج.</b> إلى الزميل الأقرب، للمشورة</li><li><b>د.</b> إلى مسؤول حماية البيانات الشخصية</li></ul></li>
<li><p>فحصتَ صورة وصلتك بأداة تقرأ بيانات اعتماد المحتوى، فلم تجد فيها أي علامة منشأ. ماذا تستنتج؟</p><ul><li><b>أ.</b> الصورة أصلية، فلا علامة توليد فيها</li><li><b>ب.</b> الصورة مصطنعة، فالأصلية تحمل علامة</li><li><b>ج.</b> لا شيء عن أصلها: غياب العلامة لا يثبت شيئًا</li><li><b>د.</b> الأداة معطلة ويجب تغييرها</li></ul></li>
<li><p>كتبتَ تقريرًا بمساعدة المساعد المعتمد، وأضفتَ إليه صورة توضيحية ولّدها. كيف تقدّمه؟</p><ul><li><b>أ.</b> دون إشارة، فالمسؤولية عليك في كل حال</li><li><b>ب.</b> بسطر إفصاح عن المساعدة، ووسم على الصورة أنها مصطنعة</li><li><b>ج.</b> بإشارة إلى أن المساعد هو كاتب التقرير</li><li><b>د.</b> بوسم على الصورة فقط، فالنص راجعته</li></ul></li>
</ol>

:"ج","text":"في الرسالة نص مخفي موجه إلى المساعد"},{"key":"د","text":"المساعد أخطأ في الترجمة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ملخص فيه طلب لا تراه في الأصل علامة على تعليمة محقونة: نص يراه المساعد ولا تراه أنت.","misconceptions":["يحسن الظن بإضافة لا أصل لها في النص الظاهر","يبحث عن تفسير بريء خارج المحتوى الذي قُرئ","","يعدّها خطأ لغويًّا والجملة تطلب إجراء ماليًّا"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-inj-02","type":"single","prompt":"وجدتَ في مستند شاركه طرف خارجي سطرًا مخفيًّا يطلب من «المساعد» مشاركة مجلد مع عنوان خارجي. ما الاستجابة الصحيحة؟","options":[{"key":"أ","text":"تحذف السطر وتكمل العمل على المستند"},{"key":"ب","text":"تطلب من المساعد أن يتجاهل السطر"},{"key":"ج","text":"تراسل الطرف الخارجي لتسأله عن السطر"},{"key":"د","text":"تتوقف، ولا تتبع، وتبلّغ الأمن السيبراني"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الاستجابة واحدة: توقف، ولا تتبع، وبلّغ، وأرسل المحتوى كما وصل.","misconceptions":["يظن أن حذف التعليمة يكفي: المحتوى لا يوثق بباقيه، والبلاغ يحتاج إليه كما وصل","يعتمد على أن المساعد سيطيع تعليمته هو دون تعليمة المهاجم","ينبّه مصدرًا قد يكون هو المهاجم قبل إبلاغ المختصين",""],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-inj-03","type":"single","prompt":"لماذا قد يتبع المساعد تعليمة كتبها غريب في صفحة ويب طُلب منه تلخيصها؟","options":[{"key":"أ","text":"لأنه يقرأ تعليماتك ومحتوى الصفحة نصًّا واحدًا"},{"key":"ب","text":"لأن الصفحة اخترقت حسابك"},{"key":"ج","text":"لأن صاحب الصفحة يملك صلاحية على المساعد"},{"key":"د","text":"لأن المساعد معطّل ويحتاج إلى تحديث"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"النموذج لا يفصل فصلًا مضمونًا بين ما طلبته أنت وما ورد في المحتوى الذي يقرؤه. لهذا يُعامل كل محتوى خارجي على أنه غير موثوق.","misconceptions":["","يتصور اختراقًا تقنيًّا، والهجوم كلمات في محتوى","يفترض صلاحية لا وجود لها: يكفي أن يُقرأ النص","يعدّ ر الدوام"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"يُفحص الطلب لا المقطع: من يستعجل ويطلب الكتمان ويمنعك من التحقق يستحق التحقق، مهما بدا صوته حقيقيًّا.","misconceptions":["يبحث عن عيوب تقنية تختفي مع تحسّن الأدوات","","يعدّ الشكل الرسمي علامة خطر أو أمان، وهو يُقلَّد بسهولة","يعلّق الحكم على ظروف قد تتوفر في طلب سليم وتغيب عن احتيالي"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-fraud-03","type":"single","prompt":"تحققتِ من طلب تحويل عاجل فتبين أنه احتيال، ولم يُحوَّل شيء. ماذا تفعلين بعد ذلك؟","options":[{"key":"أ","text":"لا شيء، فلم يقع ضرر"},{"key":"ب","text":"تحذفين الرسائل والمقطع من جوالك"},{"key":"ج","text":"توثّقين ما حدث وتبلّغين الأمن السيبراني"},{"key":"د","text":"تردّين على المحتال لتعرفي من هو"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المحاولة تُبلَّغ ولو فشلت، مع الأدلة كما هي: الرقم، والتسجيل، والمقطع، والرسالة.","misconceptions":["يظن أن البلاغ للخسائر فقط: المحتال سيحاول مع زميل آخر","يتلف الدليل الذي يحتاج إليه التحقيق","","يفتح قناة مع المحتال ويعرّض نفسه لمحاولة ثانية"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-fraud-04","type":"single","prompt":"وصلتك لقطة شاشة لتحويل بنكي «تم بنجاح» من مورّد يطلب تسليم البضاعة فورًا. بمَ تثق؟","options":[{"key":"أ","text":"باللقطة، فشعار البنك واضح فيها"},{"key":"ب","text":"باللقطة إن وصلت من بريد المورّد المعتاد"},{"key":"ج","text":"بكشف حساب الجهة أو بتأكيد من قسم المالية"},{"key":"د","text":"بتأكيد المورّد في مكالمة على الرقم الذي أرسل منه"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المستند واللقطة ادعاء لا إثبات. الإثبات من المصدر نفسه: كشف الحساب، أو النظام المالي.","misconceptions":["يعدّ المظهر دليلًا: اللقطة والمستند يُصطنعان في دقائق","ينسى أن البريد يُخترق ويُنتحل","","يتحقق من صاحب الادعاء بسؤال صاحب الادعاء"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-incident-01","type":"single","prompt":"انتبه موظف إلى أنه لصق أمس ملفًا «سريًّا» فيه بيانات موظفين في مساعد مجاني بحسابه الشخصي. ما أول ما يفعله؟","options":[{"key":"أ","text":"يحذف المحادثة وينتهي الأمر"},{"key":"ب","text":"يتوقف، ويسجّل ما حدث، ويبلّغ مسؤول حماية البيانات"},{"key":"ج","text":"ينتظر ليتأكد هل وقع ضرر"},{"key":"د","text":"يسأل المساعد هل حُفظ الملف"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الترتيب: توقف، وسجّل، وبلّغ، وامنع التكرار. الحذف يأتي بعد التسجيل وبتوجيه من تبلّغه.","misconceptions":["يظن أن الحذف يعيد الوضع كما كان، ويتلف ما يحتاج إليه التحقيق","","يؤجل البلاغ، ومدة الإشعار النظامية تُحسب من علم الجهة","يطلب الحقيقة من الأداة لا من الشروط ولا من المختصين"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-incident-02","type":"single","prompt":"لمن يُرفع أولًا بلاغ عن بيانات شخصية وصلت إلى أداة غير معتمدة؟","options":[{"key":"أ","text":"إلى الدعم التقني، ليحذف الحساب"},{"key":"ب","text":"إلى الاتصال المؤسسي، ليجهّز بيانًا"},{"key":"ج","text":"إلى الزميل الأقرب، للمشورة"},{"key":"د","text":"إلى مسؤول حماية البيانات الشخصية"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"ما فيه بيانات شخصية وصلت إلى غير موضعها يذهب إلى مسؤول حماية البيانات الشخصية، مع إحاطة المدير المباشر.","misconceptions":["يعدّها مشكلة تقنية، وهي حادثة بيانات شخصية لها مسؤول","يقدّم صورة الجهة على حماية أصحاب البيانات","يستشير من لا يملك القرار ويؤخر البلاغ",""],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-incident-03","type":"single","prompt":"فحصتَ صورة وصلتك بأداة تقرأ بيانات اعتماد المحتوى، فلم تجد فيها أي علامة منشأ. ماذا تستنتج؟","options":[{"key":"أ","text":"الصورة أصلية، فلا علامة توليد فيها"},{"key":"ب","text":"الصورة مصطنعة، فالأصلية تحمل علامة"},{"key":"ج","text":"لا شيء عن أصلها: غياب العلامة لا يثبت شيئًا"},{"key":"د","text":"الأداة معطلة ويجب تغييرها"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"العلامة الموجودة تخبرك بشيء، والغائبة لا تخبرك بشيء. التحقق يعود إلى المصدر والسياق.","misconceptions":["يعدّ غياب العلامة دليل أصالة: العلامة تُزال أو لا تُضاف أصلًا","يعكس الخطأ: أكثر الصور الأصلية بلا علامة منشأ","","ينسب النتيجة إلى عطل لا إلى حدود العلامات"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-incident-04","type":"single","prompt":"كتبتَ تقريرًا بمساعدة المساعد المعتمد، وأضفتَ إليه صورة توضيحية ولّدها. كيف تقدّمه؟","options":[{"key":"أ","text":"دون إشارة، فالمسؤولية عليك في كل حال"},{"key":"ب","text":"بسطر إفصاح عن المساعدة، ووسم على الصورة أنها مصطنعة"},{"key":"ج","text":"بإشارة إلى أن المساعد هو كاتب التقرير"},{"key":"د","text":"بوسم على الصورة فقط، فالنص راجعته"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"تفصح عن مساعدة الذكاء الاصطناعي في العمل، وتسم المحتوى المصطنع بوضوح، ويبقى العمل باسمك ومسؤوليتك.","misconceptions":["يخلط بين تحمّل المسؤولية والإفصاح: كلاهما مطلوب","","ينقل المسؤولية إلى الأداة، وهي تبقى على صاحب العمل","يظن أن المراجعة تغني عن الإفصاح عن المساعدة"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"}]}</script>
